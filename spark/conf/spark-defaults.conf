# Dependencias (resueltas en el primer arranque, cacheadas en el volumen spark-ivy)
spark.jars.packages  org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.1,org.apache.iceberg:iceberg-aws-bundle:1.10.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6,com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11
spark.jars.ivy       /opt/spark/ivy

# Iceberg: catálogo "lake" (REST en local; en AWS -> type=glue, sin cambiar jobs)
spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                  rest
spark.sql.catalog.lake.uri                   http://iceberg-rest:8181
spark.sql.catalog.lake.warehouse             s3://warehouse/
spark.sql.catalog.lake.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint           http://objectstore:8333
spark.sql.catalog.lake.s3.path-style-access  true
# SeaweedFS guarda literal el framing aws-chunked del SDK v2: desactivarlo (en S3 real no hace falta)
spark.sql.catalog.lake.s3.chunked-encoding-enabled  false
spark.sql.defaultCatalog                     lake

# Tuning para contenedor local: el default de 200 shuffle partitions es excesivo
spark.master                                          local[*]
spark.driver.memory                                   2g
spark.sql.shuffle.partitions                          8
spark.sql.adaptive.enabled                            true
spark.sql.adaptive.coalescePartitions.enabled         true
spark.sql.adaptive.advisoryPartitionSizeInBytes       128m
spark.sql.session.timeZone                            UTC
spark.sql.streaming.metricsEnabled                    true
spark.ui.port                                         4040

# Menos ruido en los logs (INFO de Spark solo en la UI)
spark.log.level                                       WARN
